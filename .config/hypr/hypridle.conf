general {
    lock_cmd = pidof hyprlock || hyprlock       # lock screen, avoid starting multiple instances
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display
    inhibit_sleep = 3                           # wait until screen is locked
}

listener {
    timeout = 150                               # 2.5 minutes
    on-timeout = brightnessctl -s set 10        # set onitor backlight to minimum, avoid 0 on OLED monitor
    on-resume = btightnessctl -r                # monitor backlight restore
}

# Lock system after 5 minutes
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn off screen after 5.5 minutes
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on && brightnessctl -r
}

# Suspend after 30 minutes
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
